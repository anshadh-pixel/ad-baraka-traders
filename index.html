    <!-- 100% Mobile Zoom & Gesture Prevention Script -->
    <script>
      (function() {
        // Prevent two-finger pinch-to-zoom on iOS Safari
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        // Prevent multi-touch pinch on Android / WebKit
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent double-tap to zoom
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, false);
      })();
    </script>
